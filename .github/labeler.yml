# Labels each PR from its branch name and changed files. The labels set the sections of the GitHub release notes (.github/release.yml).
enhancement:
    - head-branch: ["^feat/"]

bug:
    - head-branch: ["^fix/"]

documentation:
    - any:
          - head-branch: ["^docs/"]
          - changed-files:
                - any-glob-to-any-file: ["docs/**", "**/*.md"]

tooling:
    - any:
          - head-branch: ["^(chore|ci|build|renovate)/"]
          - changed-files:
                - any-glob-to-any-file: [".github/**", ".husky/**"]

quality:
    - any:
          - head-branch: ["^(test|refactor|perf)/"]
          - changed-files:
                - any-glob-to-any-file: ["**/*.test.ts", "**/*.test.tsx"]
