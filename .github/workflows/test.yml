name: Tests
on: push
jobs:
    test:
        name: Test (Node ${{ matrix.node-version }})
        timeout-minutes: 60
        runs-on: ubuntu-latest
        strategy:
            matrix:
                # Vite 8 requires Node >=20.19 or >=22.12.
                # The library itself works on any Node >=20.
                node-version: ["20.19", "22.12", "24"]
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Detect package manager
              id: detect-package-manager
              run: |
                  if [ -f "${{ github.workspace }}/yarn.lock" ]; then
                    echo "manager=yarn" >> $GITHUB_OUTPUT
                    echo "command=install --frozen-lockfile" >> $GITHUB_OUTPUT
                    echo "runner=yarn" >> $GITHUB_OUTPUT
                    exit 0
                  elif [ -f "${{ github.workspace }}/package.json" ]; then
                    echo "manager=npm" >> $GITHUB_OUTPUT
                    echo "command=ci" >> $GITHUB_OUTPUT
                    echo "runner=npx --no-install" >> $GITHUB_OUTPUT
                    exit 0
                  else
                    echo "Unable to determine package manager"
                    exit 1
                  fi
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: ${{ steps.detect-package-manager.outputs.manager }}
            - name: Install dependencies
              run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
            - name: Lint
              run: ${{ steps.detect-package-manager.outputs.manager }} run lint
            - name: Test
              run: ${{ steps.detect-package-manager.outputs.manager }} run test
            - name: Type-check (all workspaces)
              run: ${{ steps.detect-package-manager.outputs.manager }} run check-types
            - name: Build package
              run: ${{ steps.detect-package-manager.outputs.manager }} run build
            - name: Check exports (attw)
              run: ${{ steps.detect-package-manager.outputs.manager }} run check-exports -w react-dsfr-tiptap
            - name: Build examples
              run: ${{ steps.detect-package-manager.outputs.manager }} run build:examples
