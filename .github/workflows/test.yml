name: Tests
on: push
jobs:
    test:
        name: Test (Node ${{ matrix.node-version }})
        timeout-minutes: 60
        runs-on: ubuntu-latest
        strategy:
            matrix:
                # Vite 8 requires Node >=20.19 or >=22.12.
                # The library itself works on any Node >=20.
                node-version: ["20.19", "22.12", "24"]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npm run lint
            - name: Test
              run: npm run test
            - name: Type-check (all workspaces)
              run: npm run check-types
            - name: Build package
              run: npm run build
            - name: Check exports (attw)
              run: npm run check-exports -w react-dsfr-tiptap
            - name: Build examples
              run: npm run build:examples
