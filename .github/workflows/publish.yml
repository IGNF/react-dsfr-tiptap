name: Publish to npm
on:
    release:
        types: [published]
permissions:
    contents: read
    # Required by npm trusted publishing (OIDC): no npm token is stored in the repo.
    id-token: write
concurrency:
    group: publish
    cancel-in-progress: false
jobs:
    publish:
        name: Publish
        timeout-minutes: 30
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  # Trusted publishing needs npm >= 11.5.1, bundled with Node 24. No cache: npm advises against it for release builds.
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false
            - name: Check that the tag matches the package version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  VERSION=$(node -p "require('./packages/react-dsfr-tiptap/package.json').version")
                  if [ "$TAG" != "v$VERSION" ]; then
                    echo "::error::Tag $TAG does not match package version v$VERSION. Merge the version bump PR first, then create the release from main."
                    exit 1
                  fi
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npm run lint
            - name: Test
              run: npm run test
            - name: Type-check (all workspaces)
              run: npm run check-types
            - name: Build package
              run: npm run build
            - name: Check exports (attw)
              run: npm run check-exports -w react-dsfr-tiptap
            - name: Publish
              env:
                  PRERELEASE: ${{ github.event.release.prerelease }}
              run: |
                  # A GitHub pre-release (e.g. v3.0.0-alpha.0) goes to the "next" dist-tag so that "latest" stays on the last stable version.
                  if [ "$PRERELEASE" = "true" ]; then
                    npm publish -w react-dsfr-tiptap --tag next
                  else
                    npm publish -w react-dsfr-tiptap
                  fi
