name: Label PR
on:
    # pull_request, not pull_request_target: GitHub blocks pull_request_target by default on public repos from 2026-12-02
    pull_request:
        types: [opened, reopened, synchronize]
permissions:
    contents: read
    pull-requests: write
jobs:
    label:
        name: Label
        # Fork PRs get a read-only token and cannot be labeled: label them by hand
        if: github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 5
        runs-on: ubuntu-latest
        steps:
            - name: Label from branch name and changed files
              uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
