name: Label PR
on:
    # pull_request_target also labels PRs from forks. Safe here: the job never checks out the PR code.
    pull_request_target:
        types: [opened, reopened, synchronize]
permissions:
    contents: read
    pull-requests: write
jobs:
    label:
        name: Label
        timeout-minutes: 5
        runs-on: ubuntu-latest
        steps:
            - name: Label from branch name and changed files
              uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
