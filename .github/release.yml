# Sections of the notes generated by the "Generate release notes" button. A PR goes into the first section matching one of its labels.
changelog:
    exclude:
        authors:
            - dependabot
    categories:
        - title: Changements majeurs ⚠️
          labels:
              - breaking
        - title: Améliorations et nouvelles fonctionnalités 🎉
          labels:
              - enhancement
        - title: Correction de bugs 🐛
          labels:
              - bug
        - title: Amélioration de la qualité
          labels:
              - quality
        - title: Documentation 📖
          labels:
              - documentation
        - title: Outillage 🔧
          labels:
              - tooling
        - title: Divers
          labels:
              - "*"
